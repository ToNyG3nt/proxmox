      <section>
        <form class="formulaire" action="https://formspree.io/f/VOTRE_CODE_UNIQUE" method="post">

            <label>
              Nom
              <input type="text" name="name" required />

              Email
              <input type="email" name="email" required placeholder="prenom.nom@my-digital-school.org" />
            </label>
          </div>
          <label>
            Sujet
            <input type="text" name="subject" />
          </label>
          <label>
            Message
            <textarea name="message" rows="6" required></textarea>
          </label>
          <button class="bouton" type="submit">Envoyer</button>
        </form>
