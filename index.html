<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hub — Mignard Maël</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22></text></svg>">
    <script src="assets/js/main.js" defer></script>
    <script src="assets/js/stats.js" defer></script>
  </head>
  <body>
    <nav class="barre-de-navigation">
      <div class="conteneur">
        <a class="marque" href="index.html">Mignard Maël</a>
        <button class="bascule-theme" aria-label="Basculer le thème"></button>
      </div>
    </nav>

    <main class="hub-principal">
      <div class="conteneur hub-conteneur">
        <div class="hub-entete">
          <h1>Hub <span class="accent">Personnel</span></h1>
          <p class="hub-sous-titre">Accès rapide à mes services</p>
        </div>
        <div class="hub-grille">
          <a class="hub-carte" href="a-propos.html">
            <div class="hub-carte-icone"><i class="fa-solid fa-user"></i></div>
            <h2>Portfolio</h2>
            <p>Projets, compétences, veille technologique</p>
          </a>
          <a class="hub-carte" href="proxmox-dashboard.html">
            <div class="hub-carte-icone"><i class="fa-solid fa-server"></i></div>
            <h2>Proxmox</h2>
            <p>Dashboard & gestion de virtualisation</p>
          </a>
          <a class="hub-carte" href="https://ssh.mael-m.fr" target="_blank" rel="noopener noreferrer">
            <div class="hub-carte-icone"><i class="fa-solid fa-terminal"></i></div>
            <h2>SSH Access</h2>
            <p>Accès terminal distant sécurisé</p>
          </a>
        </div>

        <div class="hub-stats" id="proxmox-stats">
          <div class="stat-bloc">
            <span class="stat-label"><span class="stat-dot offline" id="stat-dot"></span> Proxmox</span>
            <span class="stat-value" id="stat-status">…</span>
          </div>
          <div class="stat-bloc">
            <span class="stat-label"><i class="fa-solid fa-microchip"></i> CPU</span>
            <span class="stat-value" id="stat-cpu">…</span>
            <div class="stat-bar-track"><div class="stat-bar" id="bar-cpu"></div></div>
          </div>
          <div class="stat-bloc">
            <span class="stat-label"><i class="fa-solid fa-memory"></i> RAM</span>
            <span class="stat-value" id="stat-ram">…</span>
            <div class="stat-bar-track"><div class="stat-bar" id="bar-ram"></div></div>
          </div>
          <div class="stat-bloc">
            <span class="stat-label"><i class="fa-solid fa-clock"></i> Uptime</span>
            <span class="stat-value" id="stat-uptime">…</span>
          </div>
        </div>

      </div>
    </main>

    <footer>
      <div class="conteneur">
        <p><span id="annee"></span> — Mignard Maël</p>
      </div>
    </footer>
  </body>
</html>
